<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cash Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="dark">

  <!-- WELCOME SCREEN -->

  <div id="welcomeScreen" class="screen active">

    <div class="welcome-card">

      <h1>Cash Calculator</h1>

      <p class="developer">
        Develop by
        <a
          href="https://wa.me/917002443108"
          target="_blank"
        >
          Jahangir Hussain
        </a>
      </p>

      <button id="startBtn">
        Start
      </button>

    </div>

  </div>

  <!-- CALCULATOR SCREEN -->

  <div id="calculatorScreen" class="screen">

    <div class="container">

      <!-- TOP BAR -->

      <div class="top-bar">

        <!-- DARK MODE -->

        <label class="switch">

          <input
            type="checkbox"
            id="themeToggle"
            checked
          >

          <span class="slider"></span>

        </label>

        <!-- CLEAR BUTTON -->

        <button id="clearBtn">
          ✕
        </button>

      </div>

      <!-- DATE -->

      <div class="top-header">

        <h2>Cash Calculator</h2>

        <p id="dateDay"></p>

      </div>

      <!-- NOTE CONTAINER -->

      <div id="noteContainer"></div>

      <!-- TOTAL SECTION -->

      <div class="summary-card">

        <div class="total-row">

          <div class="notes-box">
            <small>Total Notes</small>
            <h3 id="totalNotes">0</h3>
          </div>

          <div class="amount-box">
            <h1>
              ₹ <span id="grandTotal">0</span>
            </h1>
          </div>

        </div>

        <!-- AMOUNT WORDS -->

        <p id="amountWords">
          Zero Rupees Only
        </p>

      </div>

      <!-- EXPECTED & DIFFERENCE -->

      <div class="summary-card">

        <div class="bottom-row">

          <input
            type="number"
            id="expectedAmount"
            placeholder="Expected Amount"
          >

          <h2 id="differenceAmount">
            ₹0
          </h2>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
